services:
  bootstrap:
    image: filament-theme-builder-prod
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command: ["/usr/local/bin/compose-bootstrap.sh"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:${GATEWAY_PORT:-9080}
      APP_DIR: /var/www/html
      BOOTSTRAP_PRODUCTION: "1"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/demo/database.sqlite
    volumes: &runtime-volumes
      - demo_db:/var/lib/demo
      - demo_storage:/var/www/html/storage/app/private
      - uploads:/var/www/html/storage/app/public
      - framework_storage:/var/www/html/storage/framework
      - logs:/var/www/html/storage/logs
      - shares_db:/var/lib/shares
      - runtime:/runtime

  demo:
    image: filament-theme-builder-prod
    working_dir: /var/www/html
    ports:
      - "${GATEWAY_HOST:-0.0.0.0}:${GATEWAY_PORT:-9080}:80"
    environment: &runtime-environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:${GATEWAY_PORT:-9080}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/demo/database.sqlite
      OCTANE_SERVER: frankenphp
    volumes: *runtime-volumes
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  scheduler:
    image: filament-theme-builder-prod
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    environment: *runtime-environment
    volumes: *runtime-volumes
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  shares_db:
  demo_db:
  demo_storage:
  uploads:
  framework_storage:
  logs:
  runtime:
