services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "/scripts/compose-bootstrap.sh"]
    environment:
      - APP_DIR=/var/www/html
      - APP_URL=http://127.0.0.1:${GATEWAY_PORT:-4175}
      - APP_KEY
    volumes:
      - ./demo:/var/www/html
      - ./scripts/compose-bootstrap.sh:/scripts/compose-bootstrap.sh:ro
      - demo_vendor:/var/www/html/vendor
    networks:
      - app

  builder-vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    volumes:
      - ./builder:/app
      - builder_node_modules:/app/node_modules
    expose:
      - "5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(({ ok }) => process.exit(ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    networks:
      - app

  demo-php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    command: ["frankenphp", "php-server", "-r", "public/"]
    environment:
      - APP_URL=http://127.0.0.1:${GATEWAY_PORT:-4175}
    volumes:
      - ./demo:/var/www/html
      - demo_vendor:/var/www/html/vendor
    expose:
      - "80"
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r 'exit(@file_get_contents(\"http://127.0.0.1/api/health\") === false ? 1 : 0);'"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - app

  demo-vite:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_DEV_SERVER_ORIGIN: http://127.0.0.1:${GATEWAY_PORT:-4175}
    volumes:
      - ./demo:/var/www/html
      - demo_node_modules:/var/www/html/node_modules
    expose:
      - "5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/_demo-vite/@vite/client').then(({ ok }) => process.exit(ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    networks:
      - app

  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4175}:80"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      builder-vite:
        condition: service_healthy
      demo-vite:
        condition: service_healthy
      demo-php:
        condition: service_healthy
    networks:
      - app

volumes:
  builder_node_modules:
  demo_node_modules:
  demo_vendor:

networks:
  app:
    driver: bridge
